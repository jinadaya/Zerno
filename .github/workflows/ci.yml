name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles every module for Android, so a broken shared file fails here first.
      - run: ./gradlew :composeApp:assembleDebug --stacktrace
      # Room exports UserDb's schema while compiling; migrations and their tests read the committed copies, so a
      # schema change must come with its JSON. The diff shows the file to commit.
      - name: Room schemas are committed
        run: |
          git add --intent-to-add data/schemas
          git diff --exit-code -- data/schemas
      # Module rules and strings (README): build-logic's own tests, then the checks on every module.
      - run: ./gradlew -p build-logic test
      - run: ./gradlew checkModuleRules checkStrings
      # Design system screenshots against the committed PNGs (README, Screenshot tests). Linux only: font rendering
      # differs between hosts, so the PNGs are recorded here too, by the Record screenshots workflow.
      - run: ./gradlew :designsystem:testAndroidHostTest
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            designsystem/build/outputs/roborazzi
            designsystem/build/reports/tests
          if-no-files-found: ignore

  lint:
    name: ktlint and detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Same script contributors run locally; style in .editorconfig, smells in config/detekt.
      - run: ./scripts/lint.sh

  ios:
    name: iOS framework and tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # commonTest runs on the iOS simulator target. The design system's Android screenshot tests run in the Android
      # job only, since the PNGs are recorded on Linux.
      - run: >-
          ./gradlew allTests :composeApp:linkDebugFrameworkIosSimulatorArm64 --continue
          -x :designsystem:testAndroidHostTest
