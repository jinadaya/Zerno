name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compiles every module for Android, so a broken shared file fails here first.
      - run: ./gradlew :composeApp:assembleDebug --stacktrace
      # Module rules and strings (README): build-logic's own tests, then the checks on every module.
      - run: ./gradlew -p build-logic test
      - run: ./gradlew checkModuleRules checkStrings

  ios:
    name: iOS framework and tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # commonTest runs on the iOS simulator target; the Android library targets have no host tests yet.
      - run: ./gradlew allTests :composeApp:linkDebugFrameworkIosSimulatorArm64 --continue
