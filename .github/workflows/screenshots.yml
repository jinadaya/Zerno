name: Record screenshots

# Rewrites the design system screenshots on a branch and commits them. Start it from the Actions tab, or put
# "[record screenshots]" in a pushed commit message (works before the workflow reaches main). Look at the PNGs in
# the commit, then push again: commits made with the workflow token start no CI run.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  record:
    name: Record design system screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :designsystem:testAndroidHostTest -Proborazzi.record=true
      - name: Commit changed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designsystem/src/androidHostTest/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are up to date."
          else
            git commit -m "Record design system screenshots"
            git push
          fi
